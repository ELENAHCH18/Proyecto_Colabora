<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Consulta - Colabora</title>
    <style>
        /* Importar fuente Ubuntu */
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap');

        /* Estilos básicos */
        body {
            font-family: 'Ubuntu', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F2F2F2;
        }

        header {
            background-color: white;
            padding: 20px 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid black;
        }

        .logo {
            font-size: 50px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 20px;
        }

        .menu a {
            text-decoration: none;
            font-size: 18px;
            padding: 10px 20px;
            border: 2px solid black;
            border-radius: 20px;
            color: black;
            background-color: white;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }

        .menu a:hover {
            background-color: black;
            color: white;
        }

        .main-content {
            margin: 50px 100px;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-family: 'Ubuntu', sans-serif;
        }

        input, textarea, select {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            border: 2px solid black;
            border-radius: 10px;
            font-family: 'Ubuntu', sans-serif; /* Aplicar fuente Ubuntu */
        }

        /* Hacer el campo de selección más corto */
        select {
            width: 20%; /* Ajustar ancho a un valor más corto */
        }

        /* Botones Publicar y Regresar en la parte inferior derecha */
        .form-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: 2px solid black;
            background-color: black;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            font-family: 'Ubuntu', sans-serif; /* Aplicar fuente Ubuntu */
        }

        button:hover {
            background-color: white;
            color: black;
        }

    </style>
</head>
<body>
    <header>
        <div class="logo">Colabora</div>
        <div class="menu">
            <a href="{{ url_for('main.logout') }}">Cerrar Sesión</a>
        </div>
    </header>

    <div class="main-content">
        <h1>Publicar Nueva Consulta</h1>

        <form action="{{ url_for('main.nueva_consulta') }}" method="POST">
            <label for="title">Título:</label>
            <input type="text" id="title" name="title" placeholder="Escribe el título de tu consulta" required>

            <label for="question_content">Contenido:</label>
            <textarea id="question_content" name="question_content" rows="5" placeholder="Escribe los detalles de tu consulta" required></textarea>

            <label for="id_category">Categoría:</label>
            <select id="id_category" name="id_category" required>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id_category }}">{{ categoria.category_name }}</option>
                {% endfor %}
            </select>

            <!-- Botones alineados a la derecha en la parte inferior -->
            <div class="form-buttons">
                <button type="submit">Publicar</button>
                <button type="button" onclick="window.location.href='{{ url_for('main.mis_consultas') }}'">Regresar</button>
            </div>
        </form>
    </div>
</body>
</html>
